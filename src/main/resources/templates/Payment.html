<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title>Payment</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" th:href="@{/css/Payment.css}" />
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css"
    />
</head>
<body>
<a class="back-button" th:href="@{/checkout}"><i class="fa fa-arrow-left" aria-hidden="true"></i></a>

<div class="payment-wrapper">
    <div class="payment-card">
        <h2 class="payment-title">Select Payment Method</h2>

        <div class="payment-methods">
            <div class="method-option selected" id="method-card" onclick="selectMethod('card')">
                <i class="fas fa-credit-card method-icon"></i>
                <div>
                    <h4>Credit / Debit Card</h4>
                    <p>Visa, MasterCard, Amex</p>
                </div>
            </div>

            <div class="method-option" id="method-cash" onclick="selectMethod('cash')">
                <i class="fas fa-money-bill-wave method-icon"></i>
                <div>
                    <h4>Cash on Delivery</h4>
                    <p>Pay when package arrives</p>
                </div>
            </div>
        </div>

        <div class="card-details" id="card-details">
            <div class="form-group">
                <label>Card Number</label>
                <input type="text" id="card-number" placeholder="1234 5678 9012 3456" maxlength="19" />
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Expiry Date</label>
                    <input type="text" id="expiry" placeholder="MM/YY" maxlength="5" />
                </div>
                <div class="form-group">
                    <label>CVV / CVC</label>
                    <input type="password" id="cvv" placeholder="•••" maxlength="4" />
                </div>
            </div>
        </div>

        <button type="button" class="pay-btn" onclick="placeOrder()">Place Order</button>
    </div>
</div>

<script th:src="@{/js/Payment.js}"></script>
</body>
</html>
