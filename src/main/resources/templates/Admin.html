<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard - Fermata</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/Home.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/Admin.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Matangi:wght@300..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
<header>
    <a href="#" class="logo">
        <img th:src="@{/images/logo_fermata-removebg-preview.png}">
    </a>
    <ul class="navbar">
        <li><a th:href="@{/}">Home</a></li>
        <li><a th:href="@{/profile}">Profile</a></li>
    </ul>
</header>

<section class="admin-section">
    <div class="admin-card">
        <h2 class="admin-title">Admin Dashboard</h2>

        <div class="stat-row">
            <span class="stat-label">Total Users</span>
            <span class="stat-value" th:text="${totalUsers}">0</span>
        </div>

        <h3 class="admin-subtitle">Users</h3>

        <div class="user-grid">
            <a th:each="u : ${users}" th:href="@{'/admin/user/' + ${u.id}}" class="user-card">
                <div class="user-card-avatar" th:text="${#strings.substring(u.username, 0, 1)}">D</div>
                <div class="user-card-info">
                    <span class="user-card-name" th:text="${u.username}">username</span>
                    <span class="user-card-sub" th:text="${u.fullName}">Full Name</span>
                </div>
                <span class="user-card-arrow">&rarr;</span>
            </a>
        </div>
    </div>
</section>
</body>
</html>
