<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - Fermata</title>
    <link rel="stylesheet" th:href="@{/css/SignIn.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="wrapper">
        <a th:href="@{/}" class="back-button"><i class="fa fa-arrow-left" aria-hidden="true"></i></a>

        <div class="logo">
            <a th:href="@{/}">
                <img th:src="@{/images/logo_fermata-removebg-preview.png}" alt="Fermata Logo">
            </a>
        </div>

        <!-- Global error alert message -->
        <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form th:action="@{/signup}" th:object="${user}" method="post">
            <div class="form-group">
                <input type="text" th:field="*{username}" placeholder="Username" required>
                <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>

            <div class="form-group">
                <input type="text" th:field="*{name}" placeholder="Name" required>
                <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="form-group">
                <input type="email" th:field="*{email}" placeholder="Email" required>
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="form-group">
                <div class="password-field">
                    <input type="password" th:field="*{password}" placeholder="Password" required>
                    <i class="fa-solid fa-eye toggle-password" title="Show password" role="button" tabindex="0" aria-label="Toggle password visibility"></i>
                </div>
                <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <div class="form-group">
                <div class="password-field">
                    <input type="password" th:field="*{confirmPassword}" placeholder="Re-Enter password" required>
                    <i class="fa-solid fa-eye toggle-password" title="Show password" role="button" tabindex="0" aria-label="Toggle password visibility"></i>
                </div>
                <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>

            <div class="terms">
                <input type="checkbox" th:field="*{termsAccepted}" id="checkbox">
                <label for="checkbox">I agree to these <a href="#">Terms & Conditions</a></label>
                <div class="field-error" th:if="${#fields.hasErrors('termsAccepted')}" th:errors="*{termsAccepted}"></div>
            </div>

            <button type="submit">Sign Up</button>
        </form>

        <div class="member">
            Already a member? <a th:href="@{/login}">Login Here</a>
        </div>
    </div>

    <script th:src="@{/js/auth.js}"></script>
</body>
</html>
